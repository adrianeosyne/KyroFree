name: Android app
on:
  push:
    branches: [main, codex/android-mobile]
    paths: ["mobile/android/**", ".github/workflows/android-release.yml"]
    tags: ["android-v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "Configure the Android signing secrets before building a release." >&2; exit 1; fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/kyro-release.jks"
      - name: Test, lint and build signed app
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kyro-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintRelease assembleRelease bundleRelease assembleDebug assembleDebugAndroidTest
      - name: Prepare downloads and verify signing
        run: |
          mkdir -p android-release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk android-release/Kyro-Android-1.0.0.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab android-release/Kyro-Android-1.0.0.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-release/Kyro-Android-1.0.0.apk
          cd android-release
          sha256sum Kyro-Android-1.0.0.apk Kyro-Android-1.0.0.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kyro-android
          path: android-release/
      - uses: actions/upload-artifact@v4
        with:
          name: android-emulator-apks
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: android-emulator-apks
          path: emulator-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install emulator-apks/debug/app-debug.apk
            adb install emulator-apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w cyou.kyro.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
            adb shell am start -n cyou.kyro.app/.MainActivity
            sleep 15
            adb shell pidof cyou.kyro.app
            adb shell screencap -p /sdcard/kyro-launch.png
            adb pull /sdcard/kyro-launch.png kyro-launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: |
            kyro-launch.png
            instrumentation.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kyro-android
          path: android-release
      - name: Publish Android release with source links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "android-v1.0.0"
          gh release create "$GITHUB_REF_NAME" android-release/* --title "Kyro for Android 1.0.0" --notes-file mobile/android/RELEASE_NOTES.md --verify-tag --latest=false
