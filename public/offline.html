<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#11101b" />
    <title>You're offline | Kyro</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 25% 20%, #37245b, transparent 55%),
          radial-gradient(ellipse at 80% 85%, #143440, transparent 55%), #11101b;
        color: #f3efff;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        width: min(540px, 100%);
        padding: 44px 32px;
        border: 1px solid #9580ff44;
        border-radius: 32px;
        text-align: center;
        background: #151321d9;
        box-shadow: 0 24px 90px #0005;
      }
      .orbit {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 0 auto 28px;
        border: 1px solid #9580ff66;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .orbit:before {
        content: "";
        position: absolute;
        inset: 14px;
        border: 1px dashed #81e7fc55;
        border-radius: 50%;
      }
      .planet {
        font-size: 52px;
        filter: drop-shadow(0 0 24px #9580ff88);
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.2em;
        color: #c4b5fd;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(26px, 6vw, 40px);
        line-height: 1.15;
        margin: 16px 0;
      }
      p {
        color: #bbb4cd;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #9580ff;
        color: #151321;
        font: 700 14px system-ui;
        padding: 14px 22px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #81e7fc;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 22px;
        color: #857d97;
      }
      #status {
        min-height: 26px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="orbit" aria-hidden="true"><span class="planet">✦</span></div>
      <span class="eyebrow">Kyro · connection paused</span>
      <h1>Your world is still here.</h1>
      <p>
        You're offline. Reconnect to the internet to open your chats and
        communities.
      </p>
      <button id="retry" type="button">Retry connection</button>
      <p id="status" role="status" aria-live="polite"></p>
      <small>Kyro will reopen when your connection returns.</small>
    </main>
    <script>
      const retry = document.getElementById("retry"),
        status = document.getElementById("status");
      async function reconnect() {
        retry.disabled = true;
        status.textContent = "Checking your connection…";
        try {
          const result = await fetch(
            "/manifest.webmanifest?reconnect=" + Date.now(),
            { cache: "no-store" },
          );
          if (!result.ok) throw new Error();
          location.reload();
        } catch {
          status.textContent =
            "Still offline. Try again when your internet is back.";
          retry.disabled = false;
        }
      }
      retry.addEventListener("click", reconnect);
      window.addEventListener("online", reconnect);
    </script>
  </body>
</html>
